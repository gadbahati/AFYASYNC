services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afasync
      POSTGRES_USER: afasync
      POSTGRES_PASSWORD: afasync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afasync -d afasync"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://afasync:afasync@db:5432/afasync
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
