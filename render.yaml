services:
  - type: web
    name: afyasync-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://afyasync-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: afyasync-db
          property: connectionString

  - type: web
    name: afyasync-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: afyasync-api
          property: host

databases:
  - name: afyasync-db
    plan: free
