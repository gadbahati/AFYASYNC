services:
  - type: web
    name: afyasync-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://afyasync-swart.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: afyasync-db
          property: connectionString

databases:
  - name: afyasync-db
    plan: free
