services:
  - type: web
    name: afyasync-api
    runtime: docker
    rootDir: backend
    plan: free
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://afyasync-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: afyasync-db
          property: connectionString

  - type: worker
    name: afyasync-worker
    runtime: docker
    rootDir: backend
    plan: free
    startCommand: python -m app.integrations.worker_runner
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: afyasync-api
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: afyasync-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://afyasync-web.onrender.com
      - key: WORKER_POLL_SECONDS
        value: "5"

  - type: web
    name: afyasync-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://afyasync-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: afyasync-db
    plan: free
