name: AfyaSync Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app migrations tests

      - name: Guard production configuration
        run: |
          python - <<'PY'
          import os
          from app.config import Settings

          os.environ["ENVIRONMENT"] = "production"
          os.environ["JWT_SECRET"] = "change-this-development-secret"
          os.environ["CORS_ORIGINS"] = "https://app.example.com"
          try:
              Settings()
          except Exception as exc:
              print("OK: production rejects default JWT secret:", type(exc).__name__)
          else:
              raise SystemExit("FAIL: production accepted default JWT secret")

          os.environ["JWT_SECRET"] = "a" * 32
          os.environ["CORS_ORIGINS"] = ""
          try:
              Settings()
          except Exception as exc:
              print("OK: production rejects missing CORS origins:", type(exc).__name__)
          else:
              raise SystemExit("FAIL: production accepted missing CORS origins")
          PY

      - name: Verify migration chain
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"FAIL: Alembic migration graph must have exactly one head; found {heads}")
          print("Alembic head:", heads[0])
          print("Migration revisions:", len(list(script.walk_revisions())))
          PY

      - name: Run tests
        run: pytest -q --tb=short
