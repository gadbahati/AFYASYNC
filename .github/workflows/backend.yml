name: AfyaSync Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app migrations tests

      - name: Guard production JWT configuration
        run: |
          python - <<'PY'
          import os
          os.environ["ENVIRONMENT"] = "production"
          os.environ["JWT_SECRET"] = "change-this-development-secret"
          try:
              from app.config import Settings
              Settings()
          except Exception as exc:
              print("OK: production rejects default JWT secret:", type(exc).__name__)
          else:
              raise SystemExit("FAIL: production accepted default JWT secret")
          PY

      - name: Verify migration chain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          versions = sorted(Path("migrations/versions").glob("*.py"))
          revisions = {}
          down_revisions = {}
          for path in versions:
              text = path.read_text()
              revision = re.search(r"^revision\s*=\s*['\"]([^'\"]+)", text, re.MULTILINE)
              down = re.search(r"^down_revision\s*=\s*(.+)$", text, re.MULTILINE)
              if revision:
                  revisions[revision.group(1)] = path.name
                  down_revisions[revision.group(1)] = down.group(1).strip() if down else "None"
          if len(revisions) != len(versions):
              raise SystemExit("FAIL: migration file without revision identifier")
          heads = [revision for revision, down in down_revisions.items() if all(revision not in value for value in down_revisions.values() if value not in {"None", "None,", "None #"})]
          if not heads:
              raise SystemExit("FAIL: migration chain has no head")
          print("Migration files:", len(versions), "candidate heads:", heads)
          PY

      - name: Run tests
        run: pytest -q --tb=short
