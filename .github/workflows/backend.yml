name: AfyaSync Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afasync
          POSTGRES_PASSWORD: afasync
          POSTGRES_DB: afasync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afasync -d afasync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://afasync:afasync@127.0.0.1:5432/afasync
      ENVIRONMENT: development
      JWT_SECRET: local-ci-only-secret-8f2b4d6c9e1a7f3b5d8c2e6a9f4b7d1c
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app migrations tests

      - name: Guard production configuration
        run: |
          python - <<'PY'
          import os
          from app.config import Settings

          secure_secret = "local-ci-only-secret-8f2b4d6c9e1a7f3b5d8c2e6a9f4b7d1c"
          base = {
              "ENVIRONMENT": "production",
              "JWT_SECRET": secure_secret,
              "CORS_ORIGINS": "https://app.example.com",
              "DATABASE_URL": "postgresql+psycopg://user:password@db.internal:5432/afasync",
          }
          cases = [
              {**base, "JWT_SECRET": "change-this-development-secret"},
              {**base, "JWT_SECRET": "a" * 31},
              {**base, "JWT_SECRET": "a" * 32},
              {**base, "CORS_ORIGINS": ""},
              {**base, "CORS_ORIGINS": "http://untrusted.example.com"},
              {**base, "DATABASE_URL": "sqlite:///afasync.db"},
          ]
          for values in cases:
              os.environ.clear()
              os.environ.update(values)
              try:
                  Settings()
              except Exception:
                  continue
              raise SystemExit("FAIL: insecure production configuration was accepted")

          os.environ.clear()
          os.environ.update(base)
          configured = Settings()
          origins = configured.cors_origin_list()
          assert origins == ["https://app.example.com"]
          assert configured.worker_poll_seconds == 5.0
          print("Production configuration guards passed")
          PY

      - name: Verify migration chain
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"FAIL: Alembic migration graph must have exactly one head; found {heads}")
          print("Alembic head:", heads[0])
          print("Migration revisions:", len(list(script.walk_revisions())))
          PY

      - name: Validate installed dependency metadata
        run: python -m pip check

      - name: Run tests with coverage
        run: pytest -q --tb=short --cov=app --cov-report=term-missing
