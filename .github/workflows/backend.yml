name: AfyaSync Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app migrations tests

      - name: Guard production configuration
        run: |
          python - <<'PY'
          import os
          from app.config import Settings

          cases = [
              {"JWT_SECRET": "change-this-development-secret", "CORS_ORIGINS": "https://app.example.com"},
              {"JWT_SECRET": "a" * 31, "CORS_ORIGINS": "https://app.example.com"},
              {"JWT_SECRET": "a" * 32, "CORS_ORIGINS": "http://untrusted.example.com"},
              {"JWT_SECRET": "a" * 32, "CORS_ORIGINS": "https://app.example.com", "DATABASE_URL": "postgresql+psycopg://afasync:afasync@localhost:5432/afasync"},
          ]
          for values in cases:
              os.environ.update({"ENVIRONMENT": "production", **values})
              try:
                  Settings()
              except Exception:
                  continue
              raise SystemExit(f"FAIL: insecure production configuration was accepted: {values}")

          os.environ.update({
              "ENVIRONMENT": "production",
              "JWT_SECRET": "a" * 32,
              "CORS_ORIGINS": "https://app.example.com",
              "DATABASE_URL": "postgresql+psycopg://user:password@db.internal:5432/afasync",
          })
          configured = Settings()
          assert configured.cors_origin_list() == ["https://app.example.com"]
          print("Production configuration guards passed")
          PY

      - name: Verify migration chain
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"FAIL: Alembic migration graph must have exactly one head; found {heads}")
          print("Alembic head:", heads[0])
          print("Migration revisions:", len(list(script.walk_revisions())))
          PY

      - name: Run tests with coverage
        run: pytest -q --tb=short --cov=app --cov-report=term-missing
