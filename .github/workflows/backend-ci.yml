name: AfyaSync Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: afasync-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afasync
          POSTGRES_PASSWORD: afasync
          POSTGRES_DB: afasync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afasync -d afasync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://afasync:afasync@127.0.0.1:5432/afasync
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare PostgreSQL extensions
        run: PGPASSWORD=afasync psql -h 127.0.0.1 -U afasync -d afasync -c 'CREATE EXTENSION IF NOT EXISTS citext;'
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Compile Python sources
        run: python -m compileall -q app migrations
      - name: Run backend tests
        env:
          ENVIRONMENT: test
        run: pytest -q
