name: AfyaSync KMHFR Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kmhfr-snapshot.yml'
      - 'backend/app/scripts/update_kmhfr_snapshot.py'
      - 'backend/app/facilities/kmhfr_registry.py'
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afyasync-kmhfr-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate official KMHFR registry
        run: python backend/app/scripts/update_kmhfr_snapshot.py

      - name: Validate snapshot before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backend/data/kmhfr_facilities.json')
          if not p.exists():
              raise SystemExit('FAIL: KMHFR snapshot file was not created')
          payload = json.loads(p.read_text(encoding='utf-8'))
          records = payload.get('records', [])
          if len(records) < 10000:
              raise SystemExit(f'FAIL: snapshot contains only {len(records)} records')
          codes = [r.get('code') for r in records if isinstance(r, dict) and r.get('code')]
          if len(set(codes)) != len(codes):
              raise SystemExit('FAIL: snapshot contains duplicate facility codes')
          names = [r.get('name') for r in records if isinstance(r, dict)]
          if not all(isinstance(name, str) and name.strip() for name in names):
              raise SystemExit('FAIL: snapshot contains unnamed facilities')
          print(f'Validated official KMHFR snapshot records={len(records)} coded={len(codes)}')
          PY

      - name: Commit registry snapshot
        run: |
          git config user.name 'AfyaSync KMHFR Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/kmhfr_facilities.json
          if git diff --cached --quiet; then
            echo 'KMHFR snapshot unchanged'
            exit 0
          fi
          git commit -m 'Refresh official KMHFR facility registry [skip ci]'
          git push
